# ==========================================================
# Spring AI - Gemini (Google GenAI / Gemini Developer API)
# Get a free key at https://aistudio.google.com/apikey
# Do NOT add spring.ai.google.genai.project-id or .location -
# setting either switches this to Vertex AI mode and a plain
# API key will then be rejected.
# ==========================================================
spring.ai.google.genai.api-key=ur api key

# "gemini-flash-latest" is Google's own alias for its current
# recommended fast Gemini model, so this line won't need to be
# updated every time Google ships a new model version.
spring.ai.google.genai.chat.options.model=gemini-flash-latest

# ==========================================================
# JWT Authentication
# JWT_SECRET must be a random string at least 32 characters
# long (HS256 requires a 256-bit key) - any long random mix of
# letters/numbers/symbols works. Then set it with:
#   setx JWT_SECRET "the_random_string_you_picked"
# ==========================================================
app.jwt.secret=pick_any_long_random_string_32+_characters
app.jwt.expiration-ms=864000000


# ==========================================================
# Email notifications (claim received / possible match found)
# Uses Gmail SMTP. MAIL_USERNAME is your full Gmail address.
# MAIL_PASSWORD must be a Gmail "App Password" (NOT your normal
# Gmail login password) - create one at:
# https://myaccount.google.com/apppasswords
# (requires 2-Step Verification turned on for the account)
#
# Unlike DB_PASSWORD/JWT_SECRET/GEMINI_API_KEY above, these two
# default to blank on purpose: notifications are a nice-to-have,
# not core to the app, so leaving them unset just means emails
# quietly don't send (logged as a warning) instead of the whole
# app refusing to start.
# ==========================================================
