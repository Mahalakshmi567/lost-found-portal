<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Access Denied</title>

    <link rel="stylesheet" href="/css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="login-container">

    <div class="login-card ticket-card fade-up">

        <div class="icon-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <line x1="8" y1="8" x2="16" y2="16"/>
            </svg>
        </div>

        <p class="eyebrow">403</p>

        <h1 class="portal-title">
            Access Denied
        </h1>

        <p class="portal-subtitle">
            You don't have permission to view this page.
        </p>

        <a href="/dashboard" class="login-btn" style="display:block; text-decoration:none;">
            Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
