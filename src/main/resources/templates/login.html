<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Login - Lost & Found Portal</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="login-container">

    <div class="login-card ticket-card fade-up">

        <div class="icon-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                <circle cx="7" cy="7" r="1.4" fill="currentColor" stroke="none"/>
            </svg>
        </div>

        <p class="eyebrow">Welcome Back</p>

        <h1 class="portal-title">
            Lostify
        </h1>

        <p class="portal-subtitle">
            Helping people reconnect with their belongings.
        </p>

        <div class="error-message" th:if="${error}" th:text="${error}">
        </div>

        <form method="post" action="/login">

            <div class="form-group">

                <label>Email Address</label>

                <input type="email"
                       name="username"
                       placeholder="Enter your email"
                       required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input type="password"
                       name="password"
                       placeholder="Enter your password"
                       required>

            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="register-section">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>

    </div>

</div>

</body>
</html>
