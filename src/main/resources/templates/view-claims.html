<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>View Claims</title>

    <link rel="stylesheet" href="/css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="claims-page">

    <div style="width:100%; max-width:900px; margin:0 auto;">

        <div class="claims-header ticket-card fade-up">

            <h1>
                Claims for:
                <span th:text="${item.itemName}"></span>
            </h1>

            <p>Everyone who has asked to claim this item is listed below.</p>

        </div>

        <div class="claims-card" th:if="${!#lists.isEmpty(claims)}">

            <table class="claims-table">

                <thead>

                <tr>
                    <th>Name</th>
                    <th>Reason</th>
                    <th>Contact</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="claim : ${claims}">

                    <td th:text="${claim.claimantName}"></td>

                    <td th:text="${claim.reason}"></td>

                    <td th:text="${claim.contactNumber}"></td>

                </tr>

                </tbody>

            </table>

        </div>

        <div class="no-claims" th:if="${#lists.isEmpty(claims)}">
            <h3>No claims yet</h3>
            <p>No one has requested this item. Check back later.</p>
        </div>

        <a href="/my-posts" class="back-btn">
            &larr; Back to My Posts
        </a>

    </div>

</div>

</body>
</html>
