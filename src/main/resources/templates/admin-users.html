<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Manage Users</title>

    <link rel="stylesheet" href="/css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="claims-page">

    <div style="width:100%; max-width:960px; margin:0 auto;">

        <div class="claims-header ticket-card fade-up">

            <h1>Manage Users</h1>

            <p>Assign roles or remove accounts. This page is restricted to ADMIN accounts.</p>

        </div>

        <div class="claims-card">

            <table class="claims-table">

                <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Remove</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="u : ${users}">

                    <td th:text="${u.name}"></td>

                    <td th:text="${u.email}"></td>

                    <td>

                        <form th:action="@{/admin/users/{id}/role(id=${u.id})}"
                              method="post"
                              style="display:flex; gap:8px; align-items:center;">

                            <select name="role" class="item-input" style="padding:7px 10px; width:auto;">
                                <option th:each="r : ${roles}"
                                        th:value="${r}"
                                        th:text="${r}"
                                        th:selected="${r == u.role}">
                                </option>
                            </select>

                            <button type="submit" class="edit-btn" style="padding:8px 14px; font-size:12.5px;">
                                Save
                            </button>

                        </form>

                    </td>

                    <td>

                        <a th:href="@{/admin/users/{id}/delete(id=${u.id})}"
                           class="delete-btn">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

        <a href="/dashboard" class="back-btn">&larr; Back to Dashboard</a>

    </div>

</div>

</body>
</html>
