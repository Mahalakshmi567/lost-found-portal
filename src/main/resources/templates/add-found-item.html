<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Report Found Item</title>
    <link rel="stylesheet" href="/css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container item-form-page">

    <div class="item-form-card ticket-card fade-up">

        <div class="item-form-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s-8-4.5-8-11.5a8 8 0 0 1 16 0C20 17.5 12 22 12 22z"/>
                <circle cx="12" cy="10" r="2.6"/>
            </svg>
        </div>

        <p class="eyebrow" style="text-align:center; display:block;">Report An Item</p>

        <h1 class="item-form-title">
            Report Found Item
        </h1>

        <p class="item-form-subtitle">
            Help someone recover their belongings by reporting a found item.
        </p>

        <form th:object="${item}"
              th:action="@{/items/found/save}"
              method="post"
              enctype="multipart/form-data"
              id="foundItemForm">

            <div class="item-group">

                <label>Item Name</label>

                <input type="text"
                       th:field="*{itemName}"
                       class="item-input">

                <div class="error-text"
                     th:if="${#fields.hasErrors('itemName')}"
                     th:errors="*{itemName}">
                </div>

            </div>

            <div class="item-group">

                <label>Upload Item Image</label>

                <input type="file"
                       name="image"
                       id="itemImage"
                       accept="image/*"
                       class="file-upload">

                <button type="button" id="aiDescribeBtn" class="ai-describe-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3v4M3 12h4M19 12h2M12 19v2M5.6 5.6l1.4 1.4M17 7l1.4-1.4"/>
                        <path d="M12 8l1.6 3.4L17 13l-3.4 1.6L12 18l-1.6-3.4L7 13l3.4-1.6z"/>
                    </svg>
                    Generate Description with AI
                </button>

                <p id="aiStatus" class="ai-status"></p>

            </div>

            <div class="item-group">

                <label>Description</label>

                <textarea th:field="*{description}"
                          class="item-textarea">
                </textarea>

                <div class="error-text"
                     th:if="${#fields.hasErrors('description')}"
                     th:errors="*{description}">
                </div>

            </div>

            <div class="item-group">

                <label>Location Found</label>

                <input type="text"
                       th:field="*{location}"
                       class="item-input">

                <div class="error-text"
                     th:if="${#fields.hasErrors('location')}"
                     th:errors="*{location}">
                </div>

            </div>

            <div class="item-group">

                <label>Date Found</label>

                <input type="date"
                       name="date"
                       class="item-input">

            </div>

            <div class="item-group">

                <label>Contact Information</label>

                <input type="text"
                       name="contactInfo"
                       class="item-input"
                       placeholder="Phone Number / Email">

            </div>

            <button type="submit"
                    class="submit-item-btn">

                Submit Found Item Report

            </button>

        </form>

    </div>

</div>

<script th:inline="javascript">
(function () {
    var fileInput = document.getElementById('itemImage');
    var aiBtn = document.getElementById('aiDescribeBtn');
    var status = document.getElementById('aiStatus');
    var descriptionField = document.getElementById('description');

    aiBtn.addEventListener('click', function () {
        var file = fileInput.files[0];

        if (!file) {
            status.textContent = 'Choose an image first.';
            status.className = 'ai-status ai-status-error';
            return;
        }

        aiBtn.disabled = true;
        status.textContent = 'Looking at your photo...';
        status.className = 'ai-status';

        var formData = new FormData();
        formData.append('image', file);

        fetch('/api/ai/describe-image', {
            method: 'POST',
            body: formData
        })
            .then(function (response) {
                return response.json().then(function (data) {
                    return { ok: response.ok, data: data };
                });
            })
            .then(function (result) {
                if (result.ok) {
                    descriptionField.value = result.data.description;
                    status.textContent = 'Description added — feel free to edit it.';
                    status.className = 'ai-status ai-status-success';
                } else {
                    status.textContent = result.data.error || 'Could not generate a description.';
                    status.className = 'ai-status ai-status-error';
                }
            })
            .catch(function () {
                status.textContent = 'Something went wrong. Please write a description manually.';
                status.className = 'ai-status ai-status-error';
            })
            .finally(function () {
                aiBtn.disabled = false;
            });
    });
})();
</script>

</body>
</html>
